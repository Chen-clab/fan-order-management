<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="870" viewBox="0 0 1440 870" role="img" aria-labelledby="title desc">
<title id="title">fan 跨境带货订单管理平台架构图</title><desc id="desc">商家门户和运营后台通过 Spring Boot 后端访问数据库、缓存、消息队列与私有对象存储。展示应用、消息队列和数据存储之间的关系。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1222"/><stop offset="1" stop-color="#152640"/></linearGradient><linearGradient id="accent"><stop stop-color="#52d4be"/><stop offset="1" stop-color="#69aaff"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6f8da8"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".18"/></filter><style>text{font-family:Inter,"Microsoft YaHei",sans-serif}.title{fill:#f4f8fc;font-size:32px;font-weight:700}.sub{fill:#9bafc3;font-size:15px}.label{fill:#e9f3fa;font-size:19px;font-weight:700}.small{fill:#a8bfd0;font-size:14px}.tag{fill:#6ddacb;font-size:12px;font-weight:600}.tag2{fill:#ffca80;font-size:12px;font-weight:600}.box{fill:#182a40;stroke:#35526a;stroke-width:1.5;rx:16;filter:url(#shadow)}.pending{stroke:#9b7748;stroke-dasharray:7 5}.line{fill:none;stroke:#6f8da8;stroke-width:2;marker-end:url(#arrow)}.group{fill:#101d30;stroke:#2c465a;stroke-width:1.5;rx:22}</style></defs>
<rect width="1440" height="870" rx="26" fill="url(#bg)"/><rect x="60" y="54" width="56" height="5" rx="3" fill="url(#accent)"/><text x="60" y="104" class="title">fan · 跨境带货订单管理平台</text><text x="60" y="136" class="sub">架构示意  /  商家合作、内容发布与带货数据</text>
<text x="60" y="202" class="tag">01 / 访问层</text><rect class="box" x="60" y="220" width="280" height="100"/><text x="84" y="260" class="label">商家门户</text><text x="84" y="286" class="small">注册 · 资质 · 商品与确认</text><rect class="box" x="60" y="345" width="280" height="100"/><text x="84" y="385" class="label">运营管理后台</text><text x="84" y="411" class="small">订单 · 视频 · 数据导入与结算</text>
<path class="line" d="M340 270 H410 V365 H453"/><path class="line" d="M340 395 H453"/>
<text x="460" y="202" class="tag">02 / 业务服务</text><rect class="group" x="450" y="220" width="525" height="400"/><text x="480" y="262" class="label">Java · Spring Boot</text><text x="480" y="288" class="small">基于 RuoYi-Vue  /  角色权限与业务规则</text>
<rect class="box" x="478" y="315" width="215" height="88"/><text x="498" y="350" class="label">合作订单</text><text x="498" y="376" class="small">报价 · 确认 · 商品快照</text><rect class="box" x="715" y="315" width="230" height="88"/><text x="735" y="350" class="label">视频与发布</text><text x="735" y="376" class="small">单商品链接 · 多次发布</text>
<rect class="box" x="478" y="425" width="215" height="88"/><text x="498" y="460" class="label">GMV 导入任务</text><text x="498" y="486" class="small">预览 · 确认 · 去重</text><rect class="box" x="715" y="425" width="230" height="88"/><text x="735" y="460" class="label">结算记录</text><text x="735" y="486" class="small">服务费 · 佣金 · 收款状态</text>
<text x="480" y="562" class="small">资质审核 · 商品素材管理</text><text x="480" y="590" class="small">发布效果统计 · 合作进度跟踪</text>
<text x="1060" y="202" class="tag">03 / 基础设施</text><rect class="box" x="1050" y="220" width="320" height="88"/><text x="1074" y="255" class="label">MySQL</text><text x="1074" y="281" class="small">订单 · 视频 · 任务 · 结算快照</text><rect class="box" x="1050" y="330" width="320" height="88"/><text x="1074" y="365" class="label">Redis</text><text x="1074" y="391" class="small">登录状态与缓存</text><rect class="box" x="1050" y="440" width="320" height="88"/><text x="1074" y="475" class="label">RabbitMQ + Outbox</text><text x="1074" y="501" class="small">异步预览与导入 · 重复消费保护</text><rect class="box" x="1050" y="550" width="320" height="88"/><text x="1074" y="585" class="label">私有对象存储</text><text x="1074" y="611" class="small">资质与商品素材</text>
<path class="line" d="M975 272 H1045"/><path class="line" d="M975 374 H1045"/><path class="line" d="M975 484 H1045"/><path class="line" d="M975 594 H1045"/>
<rect x="60" y="685" width="1310" height="120" rx="16" fill="#142339" stroke="#29465c"/><text x="88" y="724" class="label">设计边界</text><text x="88" y="754" class="small">一个订单可包含多个商品；每条视频绑定一个商品链接；多个视频可使用同一链接。</text><text x="88" y="780" class="small">权限控制、数据隔离和备份共同保障业务协作。</text>
</svg>
